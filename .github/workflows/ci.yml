name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
        exclude:
          # Python 3.9 on Windows is slow to set up and adds nothing: the code
          # path that differs between the platforms is the file reading.
          - os: windows-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run the test suite with coverage
        run: python -m pytest --cov=src --cov-report=term-missing --cov-report=xml
      - name: Upload the coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  self-scan:
    name: Scan the repository with the tool itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Scan the example configurations
        run: |
          python main.py examples/Dockerfile.insecure --no-color --format console
          python main.py examples/docker-compose.insecure.yml --no-color --format markdown
      - name: Fail if a hardened example is not clean
        run: |
          python main.py examples/Dockerfile.secure --no-color --fail-on low
          python main.py examples/docker-compose.secure.yml --no-color --fail-on low
          python main.py examples/daemon.json.secure --no-color --fail-on low
          python main.py examples/docker-inspect.secure.json --no-color --fail-on low
      - name: Produce a SARIF report of the insecure examples
        run: |
          python main.py examples --no-color --format sarif --fail-on none --output dss.sarif
      - name: Upload the SARIF report
        uses: actions/upload-artifact@v4
        with:
          name: sarif
          path: dss.sarif
          if-no-files-found: ignore
