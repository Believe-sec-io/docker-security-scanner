[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-security-scanner"
version = "1.0.0"
description = "Audit de securite hors-ligne des Dockerfiles, images et conteneurs (stdlib uniquement)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["docker", "security", "scanner", "devsecops", "cis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]

[project.scripts]
docker-security-scanner = "docker_scanner:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
